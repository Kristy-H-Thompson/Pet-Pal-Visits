<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Pal Visits With Matthew</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
</head>
<body class="font-sans bg-[#f2f8f1]">

    <!-- Navbar -->
<!-- Navbar -->
<nav class="bg-gradient-to-r from-[#254a58] to-[#407e94] text-white p-4 shadow-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
        <!-- Logo -->
        <div class="flex items-center space-x-4">
            <img src="https://i.postimg.cc/bN8Fnxj8/mountain.png" alt="Pet Pal Visits Logo" class="w-20 h-auto">
            <div class="text-3xl font-bold">Pet Pal Visits With Matthew</div>
        </div>
        
        <!-- Desktop Menu -->
        <ul class="hidden md:flex space-x-8 text-lg">
            <li><a href="#hero" class="hover:text-[#c0dee3]">Home</a></li>
            <li><a href="#services" class="hover:text-[#c0dee3]">Services</a></li>
            <li><a href="#team" class="hover:text-[#c0dee3]">Our Team</a></li>
            <li><a href="#testimonials" class="hover:text-[#c0dee3]">Testimonials</a></li>
            <li><a href="#contact" class="hover:text-[#c0dee3]">Contact</a></li>
        </ul>

        <!-- Mobile Menu Button (Hamburger) -->
        <div class="md:hidden flex items-center">
            <button id="hamburger" class="text-3xl">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </div>

    <!-- Mobile Menu (Hidden by default) -->
    <div id="mobileMenu" class="md:hidden absolute left-0 top-0 w-full bg-[#254a58] bg-opacity-90 text-white p-8 transform translate-y-[-100%] transition-transform duration-300 ease-in-out">
        <ul class="space-y-6 text-lg">
            <li><a href="#hero" class="hover:text-[#c0dee3]">Home</a></li>
            <li><a href="#services" class="hover:text-[#c0dee3]">Services</a></li>
            <li><a href="#team" class="hover:text-[#c0dee3]">Our Team</a></li>
            <li><a href="#testimonials" class="hover:text-[#c0dee3]">Testimonials</a></li>
            <li><a href="#contact" class="hover:text-[#c0dee3]">Contact</a></li>
        </ul>
    </div>
</nav>    <!-- Footer Section -->
<footer class="bg-[#254a58] text-white py-8">
    <div class="max-w-6xl mx-auto text-center">
        <!-- Logo and Company Name -->
        <div class="mb-6">
            <img src="https://i.postimg.cc/bN8Fnxj8/mountain.png" alt="Pet Pal Visits Logo" class="w-20 h-auto mx-auto">
            <div class="text-2xl font-bold mt-4">Pet Pal Visits With Matthew</div>
        </div>

        <!-- Contact Information -->
        <div class="text-lg mb-4">
            <p>Email: <a href="mailto:matthew.sky.hayes@gmail.com" class="text-[#c0dee3]">matthew.sky.hayes@gmail.com</a></p>
            <p>Facebook: <a href="https://www.facebook.com/groups/795858148714493" class="text-[#c0dee3]">link</a></p>
        </div>


        <!-- Copyright -->
        <div class="text-sm text-gray-400 mt-4">
            <p>&copy; 2025 Pet Pal Visits With Matthew. All rights reserved.</p>
        </div>
    </div>
</footer>
</body>
    <!-- Script for toggling the mobile menu -->
<script>
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    
    hamburger.addEventListener('click', () => {
        mobileMenu.classList.toggle('translate-y-[-100%]');  // Toggles the menu sliding in and out
    });
</script>

</html>
